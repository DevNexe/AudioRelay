name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed release
    runs-on: ubuntu-latest
    env:
      MODULE: app
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Expected secrets:
      # ANDROID_KEYSTORE_BASE64 - base64-encoded keystore file
      # ANDROID_KEYSTORE_PASSWORD - keystore password
      # ANDROID_KEY_ALIAS - signing key alias
      # ANDROID_KEY_PASSWORD - signing key password
      - name: Restore release keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK and AAB
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            :${MODULE}:assembleRelease \
            :${MODULE}:bundleRelease

      - name: Build unsigned test release APK and AAB
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          ./gradlew --no-daemon --stacktrace \
            :${MODULE}:assembleRelease \
            :${MODULE}:bundleRelease

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          find "$MODULE/build/outputs/apk/release" -type f -name '*.apk' -exec cp {} release-artifacts/ \; 2>/dev/null || true
          find "$MODULE/build/outputs/bundle/release" -type f -name '*.aab' -exec cp {} release-artifacts/ \; 2>/dev/null || true
          test -n "$(find release-artifacts -type f -print -quit)"
          sha256sum release-artifacts/* | tee release-artifacts/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "${{ github.event.repository.name }} $GITHUB_REF_NAME" \
            --generate-notes \
            release-artifacts/*

      - name: Check signing configuration
        if: always()
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo 'WARNING: signing secrets are not configured.'
            echo 'The Gradle project must either provide its own release signingConfig or the build will fail.'
          fi
